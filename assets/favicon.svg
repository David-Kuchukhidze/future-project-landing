<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A38E8" />
      <stop offset="100%" stop-color="#5F1E9F" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#090314" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#primary-grad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Stylized Geometric N / Pulse Symbol -->
  <path d="M18 44V20L32 36L46 20V44" stroke="url(#accent-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="32" cy="36" r="3.5" fill="#FFFFFF" />
</svg>
